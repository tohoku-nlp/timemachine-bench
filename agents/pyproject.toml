[project]
name = "timemachine-bench-agents"
version = "1.0.0"
description = "Official implementation of baseline agents from the paper 'TimeMachine-bench: A Benchmark for Evaluating Model Capabilities in Repository-Level Migration Tasks' (EACL 2026)"
readme = "README.md"
requires-python = "==3.12.10"
dependencies = [
    "langchain-aws==0.2.27",
    "langchain-openai==0.3.33",
    "langgraph==0.4.10",
    "openai==1.108.1",
    "tenacity==9.1.2",
]

[tool.setuptools]
package-dir = {"utils" = "src/utils"}
packages = ["utils"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
